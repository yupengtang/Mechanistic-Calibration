name: Publish camera-ready release

on:
  push:
    tags:
      - "neurips-2026-camera-ready"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Package the browsable reproducibility directory
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('reproducibility')
          with zipfile.ZipFile('when-expert-disagreement-hurts-reproducibility.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and '__pycache__' not in path.parts and path.suffix != '.pyc':
                      archive.write(path, Path('supplementary') / path.relative_to(root))
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "NeurIPS 2026 camera-ready" \
            --notes-file .github/release-notes.md \
            docs/assets/paper.pdf#paper.pdf \
            release-assets/arxiv-preprint.pdf#arxiv-preprint.pdf \
            release-assets/neurips-2026-camera-ready-source.zip#neurips-2026-camera-ready-source.zip \
            release-assets/arxiv-source.tar.gz#arxiv-source.tar.gz \
            when-expert-disagreement-hurts-reproducibility.zip#when-expert-disagreement-hurts-reproducibility.zip
