name: Reproduce camera-ready analyses

on:
  push:
    branches: [main]
    paths:
      - "reproducibility/**"
      - "experiment/src/data_structures.py"
      - "experiment/src/__init__.py"
      - "experiment/tests/**"
      - ".github/workflows/reproduce.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "reproducibility/**"
      - "experiment/src/data_structures.py"
      - "experiment/src/__init__.py"
      - "experiment/tests/**"
      - ".github/workflows/reproduce.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: reproducibility/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r reproducibility/requirements.txt
      - name: Reproduce tables and analyses
        working-directory: reproducibility
        run: python reproduce.py
      - name: Verify input recovery and complete evidence spans
        run: python -m unittest discover -s reproducibility/data-repair -p 'test_*.py' -v
      - name: Verify experiment input loading
        run: python -S -m unittest discover -s experiment/tests -p 'test_*.py' -v
      - name: Verify checked-in numerical outputs
        run: git diff --exit-code -- reproducibility/rebuttal/analysis reproducibility/tables
      - name: Regenerate figures
        working-directory: reproducibility
        run: python make_figures.py
